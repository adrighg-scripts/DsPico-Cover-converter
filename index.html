<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Pro Tool v1.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-6">
    <div id="ui" class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-yellow-500 mb-6">Pro ROM Manager</h1>
        
        <div id="step1" class="space-y-4">
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="bg-yellow-600 px-6 py-3 rounded-xl font-bold">1. Bilder laden</button>
            <button id="btnSd" class="bg-blue-600 px-6 py-3 rounded-xl font-bold">2. SD-Karte wählen</button>
        </div>

        <div id="mappingArea" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8 mt-10">
            <div id="gallery" class="space-y-4"></div>
            <div class="bg-slate-900 p-4 rounded-xl">
                <input type="text" id="search" placeholder="ROM suchen..." class="w-full p-2 bg-slate-800 rounded mb-4">
                <div id="romList" class="h-96 overflow-y-auto"></div>
                <button id="saveBtn" class="w-full mt-4 bg-emerald-600 py-3 rounded-xl font-bold">Save Pictures to SD</button>
            </div>
        </div>
        <p class="fixed bottom-4 right-4 text-slate-600 text-sm">v1.0</p>
    </div>

    <script>
        let images = [], roms = [], romHandleMap = new Map(), dirHandle;

        // ROM-Suche
        document.getElementById('btnSd').onclick = async () => {
            dirHandle = await window.showDirectoryPicker();
            const romExtensions = ['nes', 'sfc', 'unf', 'fds', 'smc', 'z64', 'n64', 'v64', 'gb', 'gbc', 'gba', 'gen', 'md', 'nds', '3ds', 'snes'];
            
            async function scan(handle) {
                for await (const entry of handle.values()) {
                    if (entry.kind === 'file') {
                        const ext = entry.name.split('.').pop().toLowerCase();
                        if (romExtensions.includes(ext)) {
                            roms.push({ name: entry.name, handle: entry });
                            romHandleMap.set(entry.name, entry);
                        }
                    } else if (entry.kind === 'directory') await scan(entry);
                }
            }
            await scan(dirHandle);
            document.getElementById('mappingArea').classList.remove('hidden');
            renderRoms();
        };

        document.getElementById('fileInput').onchange = (e) => {
            Array.from(e.target.files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (ev) => images.push({ name: file.name, data: ev.target.result, assigned: null, id: index });
                reader.readAsDataURL(file);
            });
        };

        function renderRoms() {
            const list = document.getElementById('romList');
            list.innerHTML = roms.map(r => `<div class="p-2 border-b border-slate-800 cursor-pointer hover:bg-slate-700" onclick="assign('${r.name}')">${r.name}</div>`).join('');
            renderGallery();
        }

        function assign(romName) { /* Logik für Zuordnung */ alert("ROM " + romName + " zugeordnet"); }

        document.getElementById('saveBtn').onclick = async () => {
            // Ordner erstellen
            const picoDir = await dirHandle.getDirectoryHandle('_pico', {create: true});
            const coversDir = await picoDir.getDirectoryHandle('covers', {create: true});
            const userDir = await coversDir.getDirectoryHandle('user', {create: true});
            
            for(let img of images) {
                const fileName = img.assigned ? img.assigned.replace(/\.[^/.]+$/, "") + ".bmp" : "nameless_picture_" + img.id + ".bmp";
                const fileHandle = await userDir.getFileHandle(fileName, {create: true});
                const writable = await fileHandle.createWritable();
                // Hier müsste der Buffer aus der BMP-Konvertierung rein
                await writable.write(img.data); 
                await writable.close();
            }
            alert("Fertig gespeichert!");
        };
    </script>
</body>
</html>
