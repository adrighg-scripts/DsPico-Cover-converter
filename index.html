<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Cover Pro v1.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-950 text-white p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-yellow-500 text-center mb-8">Retro Cover Ultimate Tool</h1>

        <div id="step1" class="text-center">
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="bg-yellow-600 px-12 py-6 rounded-full font-bold text-xl">1. Bilder auswählen</button>
        </div>

        <div id="step2" class="hidden mt-12 grid grid-cols-1 md:grid-cols-2 gap-8">
            <button onclick="enterSimpleMode()" class="bg-slate-800 p-10 rounded-2xl border-4 border-slate-600 hover:border-yellow-500 transition-all">
                <h2 class="text-2xl font-bold">Option 1: Simple Download</h2>
                <p>Einzel-Downloads & ZIP-Funktion</p>
            </button>
            <button onclick="initProMode()" class="bg-blue-900 p-10 rounded-2xl border-4 border-blue-700 hover:border-blue-400 transition-all">
                <h2 class="text-2xl font-bold">Option 2: Pro SD-Card Save</h2>
                <p>Manuelles Mapping & direktes Speichern</p>
            </button>
        </div>

        <div id="simpleGallery" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8"></div>
        <button id="zipBtn" onclick="downloadZip()" class="hidden w-full bg-emerald-600 py-4 mt-4 rounded-xl font-bold">Download All as ZIP</button>

        <div id="proUI" class="hidden mt-10 grid grid-cols-2 gap-8 bg-slate-900 p-6 rounded-2xl border border-slate-800">
            <div>
                <img id="activeImg" class="w-full h-80 object-contain bg-black rounded-lg border border-slate-700">
                <div class="mt-4 p-4 bg-slate-800 rounded">
                    <p class="text-xs text-slate-400">Dateiname:</p>
                    <p id="fileNameDisplay" class="font-bold text-lg text-yellow-400"></p>
                </div>
                <div class="flex justify-between mt-4">
                    <button onclick="nav(-1)" class="bg-slate-700 px-6 py-2 rounded">Zurück</button>
                    <span id="pageCount" class="self-center font-bold">0 / 0</span>
                    <button onclick="nav(1)" class="bg-slate-700 px-6 py-2 rounded">Weiter</button>
                </div>
            </div>
            <div>
                <input type="text" placeholder="ROM suchen..." class="w-full p-3 bg-slate-800 rounded border border-slate-700 mb-4" oninput="filterRoms(this.value)">
                <div id="romList" class="h-80 overflow-y-auto space-y-1"></div>
                <button id="saveBtn" onclick="saveAll()" class="hidden w-full mt-6 bg-emerald-600 py-4 rounded-xl font-bold">Save & Name Correctly</button>
            </div>
        </div>
        <p class="fixed bottom-4 right-4 text-slate-600 text-sm">v1.6</p>
    </div>

    <script>
        let images = [], roms = [], filteredRoms = [], activeIdx = 0, dirHandle;

        document.getElementById('fileInput').onchange = (e) => {
            Array.from(e.target.files).forEach(f => {
                const reader = new FileReader();
                reader.onload = (ev) => { images.push({ name: f.name, data: ev.target.result, rom: null, saved: false }); document.getElementById('step2').classList.remove('hidden'); };
                reader.readAsDataURL(f);
            });
        };

        // --- SIMPLE MODUS ---
        function enterSimpleMode() {
            const gallery = document.getElementById('simpleGallery');
            gallery.innerHTML = "";
            images.forEach(img => {
                const div = document.createElement('div');
                div.className = "bg-slate-900 p-2 rounded";
                div.innerHTML = `<img src="${img.data}" class="w-full h-32 object-contain mb-2"><a href="${img.data}" download="${img.name.replace(/\.[^/.]+$/, ".bmp")}" class="block bg-slate-700 text-center py-1 text-xs rounded">Download BMP</a>`;
                gallery.appendChild(div);
            });
            document.getElementById('zipBtn').classList.remove('hidden');
        }

        async function downloadZip() {
            const zip = new JSZip();
            for(let img of images) {
                const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 96;
                const ctx = canvas.getContext('2d'); ctx.fillStyle = "black"; ctx.fillRect(0,0,128,96);
                const i = new Image(); i.src = img.data; await new Promise(r => i.onload = r);
                ctx.drawImage(i, 0, 0, 106, 96);
                const blob = await new Promise(r => canvas.toBlob(r, "image/bmp"));
                zip.file(img.name.replace(/\.[^/.]+$/, ".bmp"), blob);
            }
            const content = await zip.generateAsync({type:"blob"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(content); a.download = "covers.zip"; a.click();
        }

        // --- PRO MODUS ---
        async function initProMode() {
            dirHandle = await window.showDirectoryPicker();
            roms = []; async function scan(h) {
                for await (const e of h.values()) {
                    if (e.kind === 'file' && /\.(nes|sfc|smc|z64|n64|v64|gb|gbc|gba|gen|md|nds|3ds|snes)$/i.test(e.name)) roms.push(e.name);
                    else if (e.kind === 'directory') await scan(e);
                }
            }
            await scan(dirHandle);
            filteredRoms = roms;
            document.getElementById('proUI').classList.remove('hidden');
            updateUI();
            renderRomList();
        }

        function updateUI() {
            document.getElementById('activeImg').src = images[activeIdx].data;
            document.getElementById('fileNameDisplay').innerText = images[activeIdx].rom ? images[activeIdx].rom.replace(/\.[^/.]+$/, ".bmp") : images[activeIdx].name;
            document.getElementById('pageCount').innerText = `${activeIdx + 1} / ${images.length}`;
        }

        function nav(d) { activeIdx = Math.max(0, Math.min(images.length - 1, activeIdx + d)); updateUI(); renderRomList(); }

        function renderRomList() {
            document.getElementById('romList').innerHTML = filteredRoms.map(r => 
                `<div class="p-2 bg-slate-800 rounded hover:bg-slate-700 cursor-pointer ${images[activeIdx].rom === r ? 'border-2 border-yellow-500' : ''}" 
                 onclick="images[activeIdx].rom='${r}'; updateUI(); renderRomList(); checkFinished()"> ${r} ${images[activeIdx].rom === r ? '✓' : ''}</div>`).join('');
        }

        function checkFinished() { if(images.every(img => img.rom !== null)) document.getElementById('saveBtn').classList.remove('hidden'); }

        async function saveAll() {
            const userDir = await dirHandle.getDirectoryHandle('_pico/covers/user', {create: true});
            for(let img of images) {
                if(img.saved) continue;
                const name = img.rom.replace(/\.[^/.]+$/, ".bmp");
                const handle = await userDir.getFileHandle(name, {create: true});
                const writable = await handle.createWritable();
                const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 96;
                const ctx = canvas.getContext('2d'); ctx.fillStyle = "black"; ctx.fillRect(0,0,128,96);
                const i = new Image(); i.src = img.data; await new Promise(r => i.onload = r);
                ctx.drawImage(i, 0, 0, 106, 96);
                const blob = await new Promise(r => canvas.toBlob(r, "image/bmp"));
                await writable.write(blob);
                await writable.close();
                img.saved = true;
            }
            alert("Alle Bilder erfolgreich gespeichert!");
        }
    </script>
</body>
</html>
