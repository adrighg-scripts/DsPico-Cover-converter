<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Cover Pro v1.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-950 text-white p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-yellow-500 text-center mb-8">Retro Cover Ultimate Tool</h1>

        <div id="step1" class="text-center">
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="bg-yellow-600 px-12 py-6 rounded-full font-bold text-xl">1. Bilder auswählen</button>
        </div>

        <div id="step2" class="hidden mt-12 grid grid-cols-1 md:grid-cols-2 gap-8">
            <button onclick="enterSimpleMode()" class="bg-slate-800 p-10 rounded-2xl border-4 border-slate-600 hover:border-yellow-500">
                <h2 class="text-2xl font-bold">Option 1: Simple Download</h2>
            </button>
            <button onclick="enterProMode()" class="bg-blue-900 p-10 rounded-2xl border-4 border-blue-700 hover:border-blue-400">
                <h2 class="text-2xl font-bold">Option 2: Pro SD-Card Save</h2>
            </button>
        </div>

        <div id="displayArea" class="mt-10"></div>

        <p class="fixed bottom-4 right-4 text-slate-600 text-sm">v1.7</p>
    </div>

    <script>
        let images = [], roms = [], activeIdx = 0, dirHandle;

        document.getElementById('fileInput').onchange = (e) => {
            images = Array.from(e.target.files).map((f, i) => ({ name: f.name, data: URL.createObjectURL(f), rom: null, saved: false }));
            document.getElementById('step2').classList.remove('hidden');
        };

        function clearArea() { document.getElementById('displayArea').innerHTML = ""; }

        function enterSimpleMode() {
            clearArea();
            const div = document.createElement('div');
            div.className = "grid grid-cols-2 md:grid-cols-4 gap-4";
            images.forEach(img => {
                div.innerHTML += `<div class="bg-slate-900 p-2"><img src="${img.data}" class="w-full h-32 object-contain mb-2"><a href="${img.data}" download="${img.name.replace(/\.[^/.]+$/, ".bmp")}" class="block bg-slate-700 text-center py-1 text-xs">Download</a></div>`;
            });
            document.getElementById('displayArea').appendChild(div);
        }

        async function enterProMode() {
            clearArea();
            dirHandle = await window.showDirectoryPicker();
            roms = []; async function scan(h) {
                for await (const e of h.values()) {
                    if (e.kind === 'file' && /\.(nes|sfc|smc|z64|n64|v64|gb|gbc|gba|gen|md|nds|3ds|snes)$/i.test(e.name)) roms.push(e.name);
                    else if (e.kind === 'directory') await scan(e);
                }
            }
            await scan(dirHandle);
            renderProUI();
        }

        function renderProUI() {
            clearArea();
            const isLast = activeIdx === images.length - 1;
            document.getElementById('displayArea').innerHTML = `
                <div class="grid grid-cols-2 gap-8 bg-slate-900 p-6 rounded-2xl border border-slate-800">
                    <div>
                        <img src="${images[activeIdx].data}" class="w-full h-80 object-contain bg-black rounded-lg">
                        <p class="mt-4 font-bold text-yellow-400">Status: ${images[activeIdx].rom || 'Keine ROM ausgewählt'}</p>
                        <div class="flex justify-between mt-4">
                            <button onclick="nav(-1)" class="bg-slate-700 px-6 py-2 rounded">Zurück</button>
                            ${isLast && images[activeIdx].rom ? 
                                `<button onclick="saveAll()" class="bg-emerald-600 px-6 py-2 rounded font-bold">Save & Name Correctly</button>` : 
                                `<button onclick="nav(1)" class="bg-slate-700 px-6 py-2 rounded ${!images[activeIdx].rom ? 'opacity-50 cursor-not-allowed' : ''}" ${!images[activeIdx].rom ? 'disabled' : ''}>Weiter</button>`}
                        </div>
                    </div>
                    <div id="romList" class="h-96 overflow-y-auto space-y-1"></div>
                </div>`;
            
            document.getElementById('romList').innerHTML = roms.map(r => 
                `<div class="p-2 bg-slate-800 cursor-pointer ${images[activeIdx].rom === r ? 'bg-yellow-700' : ''}" onclick="images[activeIdx].rom='${r}'; renderProUI();">${r}</div>`).join('');
        }

        function nav(d) {
            if(d > 0 && !images[activeIdx].rom) return;
            activeIdx = Math.max(0, Math.min(images.length - 1, activeIdx + d));
            renderProUI();
        }

        async function saveAll() {
            const userDir = await dirHandle.getDirectoryHandle('_pico/covers/user', {create: true});
            for(let img of images) {
                const name = img.rom.replace(/\.[^/.]+$/, ".bmp");
                const handle = await userDir.getFileHandle(name, {create: true});
                const writable = await handle.createWritable();
                const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 96;
                const ctx = canvas.getContext('2d'); ctx.fillStyle = "black"; ctx.fillRect(0,0,128,96);
                const i = new Image(); i.src = img.data; await new Promise(r => i.onload = r);
                ctx.drawImage(i, 0, 0, 106, 96);
                const blob = await new Promise(r => canvas.toBlob(r, "image/bmp"));
                await writable.write(blob);
                await writable.close();
            }
            alert("Erledigt!");
        }
    </script>
</body>
</html>
