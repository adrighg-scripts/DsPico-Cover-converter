<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Cover Ultimate Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-950 text-white p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-yellow-500 mb-6 text-center">Ultimate Retro Tool</h1>
        
        <div id="uploadArea" class="bg-slate-900 p-8 rounded-2xl border-2 border-dashed border-slate-700 text-center">
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="bg-yellow-600 px-8 py-4 rounded-full font-bold">Bilder auswählen</button>
        </div>

        <div id="modeSelection" class="hidden mt-8 grid grid-cols-1 md:grid-cols-2 gap-4">
            <button onclick="startSimpleMode()" class="bg-slate-800 p-6 rounded-xl hover:bg-slate-700">
                <h2 class="font-bold text-xl">Simple Download</h2>
                <p class="text-sm text-slate-400">Wie vorher (Zip oder einzeln)</p>
            </button>
            <button onclick="startProMode()" class="bg-blue-900 p-6 rounded-xl hover:bg-blue-800">
                <h2 class="font-bold text-xl">Pro SD-Card Save</h2>
                <p class="text-sm text-blue-200">Automatische Suche & Speichern</p>
            </button>
        </div>

        <div id="gallery" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8"></div>
    </div>

    <script>
        let images = [];
        document.getElementById('fileInput').onchange = (e) => {
            Array.from(e.target.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    images.push({ name: file.name, data: ev.target.result });
                    document.getElementById('modeSelection').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            });
        };

        // --- SIMPLE MODUS (Wie zuvor) ---
        function startSimpleMode() {
            images.forEach(img => {
                const div = document.createElement('div');
                div.className = "bg-slate-900 p-2 rounded";
                div.innerHTML = `<img src="${img.data}" class="w-full mb-2"><a href="${img.data}" download="${img.name}" class="block bg-slate-700 text-center py-1 text-xs">Download</a>`;
                document.getElementById('gallery').appendChild(div);
            });
        }

        // --- PRO MODUS (SD-Karte & Mapping) ---
        async function startProMode() {
            const dirHandle = await window.showDirectoryPicker();
            alert("Suche nach ROMs auf der SD-Karte... (kann dauern)");
            
            // ROM Suche Logik
            let roms = [];
            async function scan(h) {
                for await (const entry of h.values()) {
                    if (entry.kind === 'file' && /\.(nes|sfc|smc|z64|n64|v64|gb|gbc|gba|gen|md|nds|3ds|snes)$/i.test(entry.name)) {
                        roms.push(entry.name);
                    } else if (entry.kind === 'directory') await scan(entry);
                }
            }
            await scan(dirHandle);
            
            // Ordner erstellen
            const picoDir = await dirHandle.getDirectoryHandle('_pico', {create: true});
            const coverDir = await picoDir.getDirectoryHandle('covers', {create: true});
            const userDir = await coverDir.getDirectoryHandle('user', {create: true});

            // Speichern
            images.forEach(async (img, i) => {
                const romMatch = roms.find(r => r.includes(img.name.split('.')[0]));
                const name = romMatch ? romMatch.replace(/\.[^/.]+$/, "") + ".bmp" : "nameless_picture_" + (i+1) + ".bmp";
                
                const fileHandle = await userDir.getFileHandle(name, {create: true});
                const writable = await fileHandle.createWritable();
                const blob = await fetch(img.data).then(r => r.blob());
                await writable.write(blob);
                await writable.close();
            });
            alert("Erledigt! Alle Bilder sind auf der SD-Karte.");
        }
    </script>
</body>
</html>
