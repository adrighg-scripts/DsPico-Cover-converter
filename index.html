<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DsPico Cover Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-950 text-white p-6 font-sans min-h-screen relative">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-yellow-500 text-center mb-8">DsPico Cover Converter</h1>
        
        <div id="step1" class="text-center">
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="bg-yellow-600 px-12 py-6 rounded-full font-bold text-xl">Choose images</button>
        </div>

        <div id="step2" class="hidden mt-12 grid grid-cols-1 md:grid-cols-2 gap-8 items-stretch">
            <button onclick="enterSimpleMode()" class="bg-slate-800 p-10 rounded-2xl border-4 border-slate-600 hover:border-yellow-500 transition-all flex flex-col items-center justify-center">
                <h2 class="text-2xl font-bold">Option 1: Normal Download</h2>
            </button>
            <div id="proContainer" class="flex flex-col">
                <button id="btnOpt2" onclick="enterProMode()" class="flex-1 bg-blue-900 p-10 rounded-2xl border-4 border-blue-700 hover:border-blue-400 transition-all flex flex-col items-center justify-center">
                    <h2 class="text-2xl font-bold">Option 2: SD-Card Save</h2>
                </button>
                <p id="compatMsg" class="hidden mt-4 text-center text-red-400 text-sm italic">
                    Not compatible with your browser. Use Chrome, Edge or Opera.
                </p>
            </div>
        </div>
        
        <div id="displayArea" class="mt-10"></div>
    </div>

    <p class="fixed bottom-4 right-4 text-slate-700 text-sm font-mono">v2.5</p>

    <script>
        let images = [], allRoms = [], activeIdx = 0, dirHandle;
        const isProSupported = 'showDirectoryPicker' in window;

        if (!isProSupported) {
            document.getElementById('btnOpt2').classList.add('opacity-30', 'cursor-not-allowed');
            document.getElementById('btnOpt2').disabled = true;
            document.getElementById('compatMsg').classList.remove('hidden');
        }

        function create8BitBMP(imgData) {
            const width = 128, height = 96, dataSize = width * height, paletteSize = 1024;
            const fileSize = 54 + paletteSize + dataSize;
            const buffer = new ArrayBuffer(fileSize);
            const view = new DataView(buffer);
            view.setUint16(0, 0x4D42, true); view.setUint32(2, fileSize, true);
            view.setUint32(10, 54 + paletteSize, true); view.setUint32(14, 40, true);
            view.setInt32(18, width, true); view.setInt32(22, height, true);
            view.setUint16(28, 8, true); view.setUint32(34, dataSize, true);
            for(let i=0; i<256; i++) {
                view.setUint8(54+i*4, (i%8)*36); view.setUint8(55+i*4, (Math.floor(i/8)%8)*36); view.setUint8(56+i*4, (Math.floor(i/64))*85);
            }
            let pos = 54 + paletteSize;
            for (let y = height - 1; y >= 0; y--) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    const index = (Math.round(imgData.data[i]/85)*64) + (Math.floor(imgData.data[i+1]/36)%8*8) + (Math.floor(imgData.data[i+2]/36)%8);
                    view.setUint8(pos++, index);
                }
            }
            return buffer;
        }

        async function processImage(imgUrl) {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 96;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#000"; ctx.fillRect(0,0,128,96);
            const i = new Image(); i.src = imgUrl; await new Promise(r => i.onload = r);
            ctx.drawImage(i, 0, 0, 106, 96);
            return create8BitBMP(ctx.getImageData(0,0,128,96));
        }

        document.getElementById('fileInput').onchange = (e) => {
            images = Array.from(e.target.files).map(f => ({ name: f.name, data: URL.createObjectURL(f), rom: null }));
            document.getElementById('step2').classList.remove('hidden');
        };

        function enterSimpleMode() {
            const area = document.getElementById('displayArea');
            area.innerHTML = `<div id="simpleGallery" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div><button id="zipBtn" class="w-full bg-emerald-600 py-4 mt-6 rounded-xl font-bold">Download All (Zip)</button>`;
            images.forEach(img => {
                const bname = img.name.replace(/\.[^/.]+$/, ".bmp");
                document.getElementById('simpleGallery').innerHTML += `<div class="bg-slate-900 p-2 border border-slate-700"><img src="${img.data}" class="w-full h-32 object-contain mb-2"><button onclick="downloadSingle('${img.data}', '${bname}')" class="w-full bg-slate-700 py-1 text-xs">Download ${bname}</button></div>`;
            });
            document.getElementById('zipBtn').onclick = downloadZip;
        }

        async function downloadSingle(url, name) {
            const buffer = await processImage(url);
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buffer])); a.download = name; a.click();
        }

        async function downloadZip() {
            const zip = new JSZip();
            for(let img of images) {
                const buffer = await processImage(img.data);
                zip.file(img.name.replace(/\.[^/.]+$/, ".bmp"), buffer);
            }
            const blob = await zip.generateAsync({type:"blob"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "retro_covers.zip"; a.click();
        }

        async function enterProMode() {
            if (!isProSupported) return;
            dirHandle = await window.showDirectoryPicker();
            allRoms = [];
            async function scan(h) {
                for await (const e of h.values()) {
                    if (e.kind === 'file' && /\.(nes|sfc|smc|z64|n64|v64|gb|gbc|gba|gen|md|nds|3ds|snes)$/i.test(e.name)) allRoms.push(e.name);
                    else if (e.kind === 'directory') await scan(e);
                }
            }
            await scan(dirHandle);
            activeIdx = 0; renderProUI();
        }

        function renderProUI() {
            const area = document.getElementById('displayArea');
            const img = images[activeIdx];
            const isLast = activeIdx === images.length - 1;
            area.innerHTML = `
                <div class="grid grid-cols-2 gap-8 bg-slate-900 p-6 rounded-2xl border border-slate-800">
                    <div>
                        <img src="${img.data}" class="w-full h-80 object-contain bg-black rounded-lg">
                        <p class="mt-4 font-bold text-yellow-400">rom: ${img.rom || 'No rom selected'}</p>
                        <div class="flex gap-4 mt-4">
                            <button onclick="nav(-1)" class="bg-slate-700 px-6 py-2 rounded">Back</button>
                            ${isLast && img.rom ? `<button onclick="saveAll()" class="bg-emerald-600 flex-1 py-2 rounded font-bold">Save & Name Correctly</button>` : `<button onclick="nav(1)" class="bg-slate-700 flex-1 py-2 rounded ${!img.rom ? 'opacity-30' : ''}" ${!img.rom ? 'disabled' : ''}>Next</button>`}
                        </div>
                    </div>
                    <div><input type="text" placeholder="Search..." class="w-full p-3 bg-slate-800 rounded mb-4" oninput="renderRomList(this.value)"><div id="romList" class="h-80 overflow-y-auto"></div></div>
                </div>`;
            renderRomList();
        }

        function renderRomList(filter = "") {
            const list = document.getElementById('romList');
            list.innerHTML = "";
            allRoms.filter(r => r.toLowerCase().includes(filter.toLowerCase())).forEach(r => {
                const el = document.createElement('div');
                el.className = `p-3 cursor-pointer border-b border-slate-700 ${images[activeIdx].rom === r ? 'bg-yellow-900' : 'hover:bg-slate-700'}`;
                el.innerText = r;
                el.onclick = () => { images[activeIdx].rom = r; renderProUI(); };
                list.appendChild(el);
            });
        }

        function nav(d) { activeIdx = Math.max(0, Math.min(images.length - 1, activeIdx + d)); renderProUI(); }

        async function saveAll() {
            const folder = await dirHandle.getDirectoryHandle('_pico', {create: true});
            const sub = await folder.getDirectoryHandle('covers', {create: true});
            const user = await sub.getDirectoryHandle('user', {create: true});
            for(let img of images) {
                const buffer = await processImage(img.data);
                const handle = await user.getFileHandle(img.rom + ".bmp", {create: true});
                const stream = await handle.createWritable();
                await stream.write(new Blob([buffer]));
                await stream.close();
            }
            alert("Saved in _pico/covers/user!");
        }
    </script>
</body>
</html>
