<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-4">
    <div class="max-w-md mx-auto">
        <h1 class="text-xl font-bold mb-6 text-center">Bilder einzeln speichern</h1>
        <input type="file" id="fileInput" multiple accept="image/*" class="w-full mb-6">
        <div id="previewList" class="grid grid-cols-2 gap-4"></div>
    </div>

    <script>
        document.getElementById('fileInput').onchange = (e) => {
            const list = document.getElementById('previewList');
            list.innerHTML = "";
            for (let file of e.target.files) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 128; canvas.height = 96;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = "black"; ctx.fillRect(0,0,128,96);
                        ctx.drawImage(img, 0, 0, 106, 96);
                        
                        const link = document.createElement('a');
                        link.innerText = "Speichern: " + file.name;
                        link.className = "bg-yellow-500 text-black p-2 rounded text-xs text-center";
                        link.onclick = () => {
                            const data = canvas.toDataURL("image/bmp");
                            link.href = data;
                            link.download = file.name.replace(/\.[^/.]+$/, "") + ".bmp";
                        };
                        list.appendChild(link);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        };
    </script>
</body>
</html>
