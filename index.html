<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Cover Pro v1.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-yellow-500 text-center mb-8">Retro Cover Ultimate Tool</h1>

        <div id="step1" class="text-center">
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="bg-yellow-600 px-8 py-4 rounded-full font-bold">1. Bilder auswählen</button>
        </div>

        <div id="step2" class="hidden mt-8 text-center space-x-4">
            <button onclick="simpleMode()" class="bg-slate-800 px-8 py-4 rounded-xl border border-slate-600">Simple Download</button>
            <button onclick="initProMode()" class="bg-blue-700 px-8 py-4 rounded-xl font-bold border border-blue-500">Pro SD-Card Save</button>
        </div>

        <div id="proUI" class="hidden mt-10 grid grid-cols-2 gap-8 bg-slate-900 p-6 rounded-2xl border border-slate-800">
            <div>
                <img id="activeImg" class="w-full h-80 object-contain bg-black rounded-lg border border-slate-700">
                <div class="flex justify-between mt-4">
                    <button onclick="nav(-1)" class="bg-slate-700 px-6 py-2 rounded">Zurück</button>
                    <span id="pageCount" class="self-center">1 / 1</span>
                    <button onclick="nav(1)" class="bg-slate-700 px-6 py-2 rounded">Weiter</button>
                </div>
            </div>
            <div>
                <input type="text" placeholder="ROM suchen..." class="w-full p-3 bg-slate-800 rounded border border-slate-700 mb-4" oninput="filterRoms(this.value)">
                <div id="romList" class="h-80 overflow-y-auto space-y-1"></div>
                <button onclick="saveAll()" class="w-full mt-6 bg-emerald-600 py-4 rounded-xl font-bold hover:bg-emerald-500">Save & Finish</button>
            </div>
        </div>
        <p class="fixed bottom-4 right-4 text-slate-600 text-sm">v1.3</p>
    </div>

    <script>
        let images = [], roms = [], filteredRoms = [], activeIdx = 0, dirHandle;

        document.getElementById('fileInput').onchange = (e) => {
            Array.from(e.target.files).forEach(f => {
                const reader = new FileReader();
                reader.onload = (ev) => { images.push({ name: f.name, data: ev.target.result, rom: null, saved: false }); document.getElementById('step2').classList.remove('hidden'); updateUI(); };
                reader.readAsDataURL(f);
            });
        };

        async function initProMode() {
            dirHandle = await window.showDirectoryPicker();
            async function scan(h) {
                for await (const e of h.values()) {
                    if (e.kind === 'file' && /\.(nes|sfc|smc|z64|n64|v64|gb|gbc|gba|gen|md|nds|3ds|snes)$/i.test(e.name)) roms.push(e.name);
                    else if (e.kind === 'directory') await scan(e);
                }
            }
            await scan(dirHandle);
            filteredRoms = roms;
            document.getElementById('proUI').classList.remove('hidden');
            renderRomList();
        }

        function updateUI() {
            if(images.length > 0) {
                document.getElementById('activeImg').src = images[activeIdx].data;
                document.getElementById('pageCount').innerText = `${activeIdx + 1} / ${images.length}`;
            }
        }

        function nav(d) { activeIdx = Math.max(0, Math.min(images.length - 1, activeIdx + d)); updateUI(); }

        function filterRoms(val) {
            filteredRoms = roms.filter(r => r.toLowerCase().includes(val.toLowerCase()));
            renderRomList();
        }

        function renderRomList() {
            document.getElementById('romList').innerHTML = filteredRoms.map(r => 
                `<div class="p-2 bg-slate-800 rounded hover:bg-slate-700 cursor-pointer" onclick="images[activeIdx].rom='${r}'; alert('Zugewiesen: ${r}')">${r}</div>`).join('');
        }

        async function saveAll() {
            const userDir = await dirHandle.getDirectoryHandle('_pico/covers/user', {create: true});
            for(let img of images) {
                if(img.saved) continue;
                const name = img.rom ? img.rom.replace(/\.[^/.]+$/, ".bmp") : `nameless_${Date.now()}.bmp`;
                const handle = await userDir.getFileHandle(name, {create: true});
                const writable = await handle.createWritable();
                const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 96;
                const ctx = canvas.getContext('2d'); ctx.fillStyle = "black"; ctx.fillRect(0,0,128,96);
                const i = new Image(); i.src = img.data; await new Promise(r => i.onload = r);
                ctx.drawImage(i, 0, 0, 106, 96); 
                const blob = await new Promise(r => canvas.toBlob(r, "image/bmp"));
                await writable.write(blob);
                await writable.close();
                img.saved = true;
            }
            alert("Erfolgreich gespeichert!");
        }

        function simpleMode() {
            alert("Simple Modus: Zip-Download Funktionalität hier einfügen.");
        }
    </script>
</body>
</html>
