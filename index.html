<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Cover Pro v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-950 text-white p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-yellow-500 text-center mb-8">Retro Cover Ultimate Tool v2.0</h1>

        <div id="step1" class="text-center">
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="bg-yellow-600 px-12 py-6 rounded-full font-bold text-xl">1. Bilder auswählen</button>
        </div>

        <div id="step2" class="hidden mt-12 grid grid-cols-1 md:grid-cols-2 gap-8">
            <button onclick="enterSimpleMode()" class="bg-slate-800 p-10 rounded-2xl border-4 border-slate-600 hover:border-yellow-500">
                <h2 class="text-2xl font-bold">Option 1: Simple Download</h2>
            </button>
            <button onclick="enterProMode()" class="bg-blue-900 p-10 rounded-2xl border-4 border-blue-700 hover:border-blue-400">
                <h2 class="text-2xl font-bold">Option 2: Pro SD-Card Save</h2>
            </button>
        </div>

        <div id="displayArea" class="mt-10"></div>
    </div>

    <script>
        let images = [], allRoms = [], activeIdx = 0, dirHandle;

        document.getElementById('fileInput').onchange = (e) => {
            images = Array.from(e.target.files).map(f => ({ name: f.name, data: URL.createObjectURL(f), rom: null }));
            document.getElementById('step2').classList.remove('hidden');
        };

        // --- 8-BIT KONVERTIERUNG (DEIN SCRIPT) ---
        function create8BitBMP(imgData) {
            const width = 128, height = 96, dataSize = width * height, paletteSize = 1024;
            const fileSize = 54 + paletteSize + dataSize;
            const buffer = new ArrayBuffer(fileSize);
            const view = new DataView(buffer);
            view.setUint16(0, 0x4D42, true); view.setUint32(2, fileSize, true);
            view.setUint32(10, 54 + paletteSize, true); view.setUint32(14, 40, true);
            view.setInt32(18, width, true); view.setInt32(22, height, true);
            view.setUint16(28, 8, true); view.setUint32(34, dataSize, true);

            for(let i=0; i<256; i++) {
                view.setUint8(54+i*4, (i%8)*36); view.setUint8(55+i*4, (Math.floor(i/8)%8)*36); view.setUint8(56+i*4, (Math.floor(i/64))*85);
            }

            let pos = 54 + paletteSize;
            for (let y = height - 1; y >= 0; y--) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    const index = (Math.round(imgData.data[i]/85)*64) + (Math.floor(imgData.data[i+1]/36)%8*8) + (Math.floor(imgData.data[i+2]/36)%8);
                    view.setUint8(pos++, index);
                }
            }
            return buffer;
        }

        async function enterProMode() {
            dirHandle = await window.showDirectoryPicker();
            allRoms = [];
            async function scan(h) {
                for await (const e of h.values()) {
                    if (e.kind === 'file' && /\.(nes|sfc|smc|z64|n64|v64|gb|gbc|gba|gen|md|nds|3ds|snes)$/i.test(e.name)) allRoms.push(e.name);
                    else if (e.kind === 'directory') await scan(e);
                }
            }
            await scan(dirHandle);
            renderProUI();
        }

        function renderProUI() {
            document.getElementById('displayArea').innerHTML = `
                <div class="grid grid-cols-2 gap-8 bg-slate-900 p-6 rounded-2xl border border-slate-800">
                    <div>
                        <img id="mainImg" src="${images[activeIdx].data}" class="w-full h-80 object-contain bg-black rounded-lg">
                        <p id="statusTxt" class="mt-4 font-bold text-yellow-400">Status: ${images[activeIdx].rom || 'Wähle eine ROM'}</p>
                        <div class="flex justify-between mt-4">
                            <button onclick="changeIdx(-1)" class="bg-slate-700 px-6 py-2 rounded">Zurück</button>
                            <button id="nextBtn" onclick="changeIdx(1)" class="bg-slate-700 px-6 py-2 rounded" ${!images[activeIdx].rom ? 'disabled style="opacity:0.3"' : ''}>Weiter</button>
                        </div>
                    </div>
                    <div>
                        <input type="text" id="romSearch" placeholder="Suche ROM..." class="w-full p-3 bg-slate-800 rounded border border-slate-700 mb-4" oninput="updateRomList()">
                        <div id="romList" class="h-80 overflow-y-auto"></div>
                        <button id="saveBtn" onclick="saveAll()" class="hidden w-full mt-6 bg-emerald-600 py-4 rounded-xl font-bold">Save & Name Correctly</button>
                    </div>
                </div>`;
            updateRomList();
        }

        function updateRomList() {
            const val = document.getElementById('romSearch').value.toLowerCase();
            const list = document.getElementById('romList');
            list.innerHTML = "";
            allRoms.filter(r => r.toLowerCase().includes(val)).forEach(r => {
                const el = document.createElement('div');
                el.className = `p-3 cursor-pointer hover:bg-slate-700 border-b border-slate-700 ${images[activeIdx].rom === r ? 'bg-yellow-900' : ''}`;
                el.innerText = r;
                el.onclick = () => {
                    images[activeIdx].rom = r;
                    document.getElementById('statusTxt').innerText = "Status: " + r;
                    document.getElementById('nextBtn').disabled = false;
                    document.getElementById('nextBtn').style.opacity = "1";
                    renderProUI(); // Neu rendern für Markierung
                };
                list.appendChild(el);
            });
        }

        function changeIdx(d) {
            if(activeIdx === images.length - 1 && d > 0) return;
            activeIdx = Math.max(0, Math.min(images.length - 1, activeIdx + d));
            renderProUI();
            checkFinished();
        }

        function checkFinished() {
            if(images.every(img => img.rom !== null) && activeIdx === images.length - 1) {
                document.getElementById('saveBtn').classList.remove('hidden');
                document.getElementById('nextBtn').classList.add('hidden');
            }
        }

        async function saveAll() {
            const userDir = await dirHandle.getDirectoryHandle('_pico/covers/user', {create: true});
            for(let img of images) {
                const name = img.rom.replace(/\.[^/.]+$/, ".bmp");
                const handle = await userDir.getFileHandle(name, {create: true});
                const writable = await handle.createWritable();
                
                const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 96;
                const ctx = canvas.getContext('2d'); ctx.fillStyle = "black"; ctx.fillRect(0,0,128,96);
                const i = new Image(); i.src = img.data; await new Promise(r => i.onload = r);
                ctx.drawImage(i, 0, 0, 106, 96);
                
                const buffer = create8BitBMP(ctx.getImageData(0,0,128,96));
                await writable.write(new Blob([buffer]));
                await writable.close();
            }
            alert("Erledigt!");
        }
    </script>
</body>
</html>
