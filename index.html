<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Cover Pro v1.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-950 text-white p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-yellow-500 text-center mb-8">Retro Cover Ultimate Tool</h1>

        <div id="step1" class="text-center">
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="bg-yellow-600 px-12 py-6 rounded-full font-bold text-xl">1. Bilder auswählen</button>
        </div>

        <div id="step2" class="hidden mt-12 grid grid-cols-1 md:grid-cols-2 gap-8">
            <button onclick="enterSimpleMode()" class="bg-slate-800 p-10 rounded-2xl border-4 border-slate-600 hover:border-yellow-500 transition-all">
                <h2 class="text-2xl font-bold">Option 1: Simple Download</h2>
            </button>
            <button onclick="enterProMode()" class="bg-blue-900 p-10 rounded-2xl border-4 border-blue-700 hover:border-blue-400 transition-all">
                <h2 class="text-2xl font-bold">Option 2: Pro SD-Card Save</h2>
            </button>
        </div>

        <div id="displayArea" class="mt-10"></div>
        <p class="fixed bottom-4 right-4 text-slate-600 text-sm">v1.8</p>
    </div>

    <script>
        let images = [], allRoms = [], filteredRoms = [], activeIdx = 0, dirHandle;

        document.getElementById('fileInput').onchange = (e) => {
            images = Array.from(e.target.files).map(f => ({ name: f.name, data: URL.createObjectURL(f), rom: null }));
            document.getElementById('step2').classList.remove('hidden');
        };

        function clearArea() { document.getElementById('displayArea').innerHTML = ""; }

        function enterSimpleMode() {
            clearArea();
            const div = document.createElement('div');
            div.className = "grid grid-cols-2 md:grid-cols-4 gap-4";
            images.forEach(img => {
                div.innerHTML += `<div class="bg-slate-900 p-2"><img src="${img.data}" class="w-full h-32 object-contain mb-2"><a href="${img.data}" download="${img.name.replace(/\.[^/.]+$/, ".bmp")}" class="block bg-slate-700 text-center py-1 text-xs">Download BMP</a></div>`;
            });
            document.getElementById('displayArea').appendChild(div);
        }

        async function enterProMode() {
            dirHandle = await window.showDirectoryPicker();
            allRoms = []; async function scan(h) {
                for await (const e of h.values()) {
                    if (e.kind === 'file' && /\.(nes|sfc|smc|z64|n64|v64|gb|gbc|gba|gen|md|nds|3ds|snes)$/i.test(e.name)) allRoms.push(e.name);
                    else if (e.kind === 'directory') await scan(e);
                }
            }
            await scan(dirHandle);
            filteredRoms = [...allRoms];
            renderProUI();
        }

        function renderProUI() {
            clearArea();
            const isLast = activeIdx === images.length - 1;
            const container = document.createElement('div');
            container.className = "grid grid-cols-2 gap-8 bg-slate-900 p-6 rounded-2xl border border-slate-800";
            container.innerHTML = `
                <div>
                    <img src="${images[activeIdx].data}" class="w-full h-80 object-contain bg-black rounded-lg">
                    <p class="mt-4 text-sm text-slate-400">Aktuell: <span class="font-bold text-yellow-400">${images[activeIdx].rom || 'Nichts ausgewählt'}</span></p>
                    <div class="flex justify-between mt-4">
                        <button onclick="changeIdx(-1)" class="bg-slate-700 px-6 py-2 rounded">Zurück</button>
                        <button id="nextBtn" onclick="changeIdx(1)" class="bg-slate-700 px-6 py-2 rounded ${!images[activeIdx].rom ? 'opacity-50' : ''}" ${!images[activeIdx].rom ? 'disabled' : ''}>Weiter</button>
                    </div>
                </div>
                <div>
                    <input type="text" placeholder="Suche ROM..." class="w-full p-3 bg-slate-800 rounded border border-slate-700 mb-4" oninput="filterList(this.value)">
                    <div id="romList" class="h-80 overflow-y-auto space-y-1"></div>
                    <button id="saveBtn" onclick="saveAll()" class="hidden w-full mt-6 bg-emerald-600 py-4 rounded-xl font-bold">Save & Name Correctly</button>
                </div>`;
            document.getElementById('displayArea').appendChild(container);
            renderRomList();
            checkAllAssigned();
        }

        function renderRomList() {
            const list = document.getElementById('romList');
            list.innerHTML = filteredRoms.map(r => 
                `<div class="p-2 cursor-pointer hover:bg-slate-700 ${images[activeIdx].rom === r ? 'bg-yellow-700' : 'bg-slate-800'}" 
                 onclick="assignRom('${r}')">${r}</div>`).join('');
        }

        function assignRom(romName) {
            images[activeIdx].rom = romName;
            renderProUI();
        }

        function filterList(val) {
            filteredRoms = allRoms.filter(r => r.toLowerCase().includes(val.toLowerCase()));
            renderRomList();
        }

        function changeIdx(d) {
            activeIdx = Math.max(0, Math.min(images.length - 1, activeIdx + d));
            renderProUI();
        }

        function checkAllAssigned() {
            if(images.every(img => img.rom !== null) && activeIdx === images.length - 1) {
                document.getElementById('saveBtn').classList.remove('hidden');
                document.getElementById('nextBtn').classList.add('hidden');
            }
        }

        async function saveAll() {
            const userDir = await dirHandle.getDirectoryHandle('_pico/covers/user', {create: true});
            for(let img of images) {
                const name = img.rom.replace(/\.[^/.]+$/, ".bmp");
                const handle = await userDir.getFileHandle(name, {create: true});
                const writable = await handle.createWritable();
                const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 96;
                const ctx = canvas.getContext('2d'); ctx.fillStyle = "black"; ctx.fillRect(0,0,128,96);
                const i = new Image(); i.src = img.data; await new Promise(r => i.onload = r);
                ctx.drawImage(i, 0, 0, 106, 96);
                const blob = await new Promise(r => canvas.toBlob(r, "image/bmp"));
                await writable.write(blob);
                await writable.close();
            }
            alert("Erledigt!");
        }
    </script>
</body>
</html>
