<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Cover Pro Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-yellow-500 mb-6">Retro Cover Pro Manager v1.0</h1>

        <div id="step1" class="bg-slate-900 p-8 rounded-2xl border-2 border-dashed border-slate-700 text-center">
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="bg-yellow-600 px-8 py-4 rounded-full font-bold hover:bg-yellow-500">1. Bilder auswählen</button>
        </div>

        <div id="step2" class="hidden mt-8">
            <div class="grid grid-cols-2 gap-8">
                <div id="imageGallery" class="space-y-4 max-h-[60vh] overflow-y-auto pr-4"></div>
                <div class="bg-slate-900 p-6 rounded-xl border border-slate-800">
                    <button id="btnSd" class="w-full bg-blue-600 py-3 rounded-lg font-bold mb-4">2. SD-Karte wählen & ROMs scannen</button>
                    <input type="text" id="search" placeholder="ROM suchen..." class="w-full p-2 bg-slate-800 rounded mb-4 border border-slate-700">
                    <div id="romList" class="h-80 overflow-y-auto space-y-1"></div>
                    <button id="saveBtn" class="w-full mt-6 bg-emerald-600 py-4 rounded-xl font-bold">Save and Name Correctly</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let images = [], roms = [], dirHandle = null, activeImgIdx = null;

        document.getElementById('fileInput').onchange = (e) => {
            Array.from(e.target.files).forEach((f, i) => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    images.push({ name: f.name, data: ev.target.result, rom: null, id: i });
                    renderGallery();
                };
                reader.readAsDataURL(f);
            });
            document.getElementById('step2').classList.remove('hidden');
        };

        // SD-Karten Scanner
        document.getElementById('btnSd').onclick = async () => {
            dirHandle = await window.showDirectoryPicker();
            const exts = ['nes', 'sfc', 'unf', 'fds', 'smc', 'z64', 'n64', 'v64', 'gb', 'gbc', 'gba', 'gen', 'md', 'md', 'nds', '3ds', 'snes'];
            async function scan(h) {
                for await (const e of h.values()) {
                    if (e.kind === 'file' && exts.includes(e.name.split('.').pop().toLowerCase())) roms.push(e.name);
                    else if (e.kind === 'directory') await scan(e);
                }
            }
            await scan(dirHandle);
            renderRoms();
        };

        function renderGallery() {
            document.getElementById('imageGallery').innerHTML = images.map((img, i) => `
                <div class="flex items-center gap-4 bg-slate-900 p-3 rounded border ${activeImgIdx === i ? 'border-yellow-500' : 'border-slate-800'}" onclick="activeImgIdx=${i}; renderGallery()">
                    <img src="${img.data}" class="w-16 h-12 object-cover rounded">
                    <div>
                        <div class="text-sm font-bold">${img.name}</div>
                        <div class="text-[10px] ${img.rom ? 'text-green-400' : 'text-red-400'}">${img.rom || 'Keine ROM zugewiesen'}</div>
                    </div>
                </div>
            `).join('');
        }

        function renderRoms() {
            document.getElementById('romList').innerHTML = roms.map(r => `<div class="p-2 bg-slate-800 rounded hover:bg-slate-700 cursor-pointer" onclick="assign('${r}')">${r}</div>`).join('');
        }

        function assign(rom) {
            if(activeImgIdx !== null) { images[activeImgIdx].rom = rom; renderGallery(); }
        }

        // BMP 8-Bit Konvertierung mit Balken rechts
        function getBmpBuffer(imgData) {
            const width = 128, height = 96, dataSize = width * height, paletteSize = 1024, fileSize = 54 + paletteSize + dataSize;
            const buffer = new ArrayBuffer(fileSize);
            const view = new DataView(buffer);
            // Header (vereinfacht)
            view.setUint16(0, 0x4D42, true); view.setUint32(2, fileSize, true);
            view.setUint32(10, 54 + paletteSize, true); view.setUint32(14, 40, true);
            view.setInt32(18, width, true); view.setInt32(22, height, true);
            view.setUint16(28, 8, true); view.setUint32(34, dataSize, true);
            // ... (Hier würde die volle Palette-Logik folgen)
            return buffer;
        }

        document.getElementById('saveBtn').onclick = async () => {
            const userDir = await dirHandle.getDirectoryHandle('_pico/covers/user', {create: true});
            for(let i=0; i<images.length; i++) {
                const img = images[i];
                const fileName = img.rom ? img.rom.replace(/\.[^/.]+$/, ".bmp") : `nameless_picture_${i+1}.bmp`;
                const fileHandle = await userDir.getFileHandle(fileName, {create: true});
                const writable = await fileHandle.createWritable();
                // Hier Bild in Canvas zeichnen (mit Balken rechts)
                const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 96;
                const ctx = canvas.getContext('2d'); ctx.fillStyle = "black"; ctx.fillRect(0,0,128,96);
                const image = new Image(); image.src = img.data;
                await new Promise(r => image.onload = r);
                ctx.drawImage(image, 0, 0, 106, 96); // Balken rechts
                // Speichern
                const blob = await new Promise(r => canvas.toBlob(r, "image/bmp"));
                await writable.write(blob);
                await writable.close();
            }
            alert("Erledigt!");
        };
    </script>
</body>
</html>
