<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Cover Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-6">
    <div class="max-w-md mx-auto">
        <h1 class="text-xl font-bold mb-4 text-center">Retro Cover Tool</h1>
        
        <div id="dropZone" class="w-full h-40 border-4 border-dashed border-slate-700 rounded-2xl flex items-center justify-center mb-6 cursor-pointer hover:border-yellow-500">
            <span class="text-slate-400">Drag & Drop Image here</span>
            <input type="file" id="fileInput" class="hidden" accept="image/*">
        </div>

        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
            <canvas id="resultCanvas" width="128" height="96" class="mx-auto"></canvas>
        </div>

        <button id="downloadBtn" class="w-full mt-6 bg-yellow-500 text-black font-bold py-3 rounded-xl hidden">Download BMP</button>
        
        <p class="fixed bottom-4 right-4 text-slate-600 text-sm">v1.0</p>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const canvas = document.getElementById('resultCanvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');

        dropZone.onclick = () => fileInput.click();
        
        fileInput.onchange = (e) => handleFile(e.target.files[0]);
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('border-yellow-500'); };
        dropZone.ondragleave = () => dropZone.classList.remove('border-yellow-500');
        dropZone.ondrop = (e) => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); };

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    // Zeichne das Bild (106px breit, 96px hoch)
                    // Der "Balken" links ist 22px breit (128-106=22)
                    ctx.fillStyle = "#222"; ctx.fillRect(0,0,128,96);
                    ctx.drawImage(img, 22, 0, 106, 96);
                    downloadBtn.classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        downloadBtn.onclick = () => {
            const imgData = ctx.getImageData(0,0,128,96);
            const buffer = create8BitBMP(imgData);
            const blob = new Blob([buffer], {type: "image/bmp"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "cover.bmp";
            a.click();
        };

        function create8BitBMP(imgData) {
            const width = 128, height = 96, paletteSize = 1024, dataSize = width * height;
            const fileSize = 54 + paletteSize + dataSize;
            const buffer = new ArrayBuffer(fileSize);
            const view = new DataView(buffer);
            view.setUint16(0, 0x4D42, true); view.setUint32(2, fileSize, true);
            view.setUint32(10, 54 + paletteSize, true);
            view.setUint32(14, 40, true);
            view.setInt32(18, width, true); view.setInt32(22, height, true);
            view.setUint16(26, 1, true); view.setUint16(28, 8, true);
            view.setUint32(34, dataSize, true);
            // Palette (hier vereinfacht als Graustufen, da DS-Injektoren meist die Palette ignorieren)
            for(let i=0; i<256; i++) { view.setUint8(54+i*4, i); view.setUint8(55+i*4, i); view.setUint8(56+i*4, i); }
            let pos = 54 + paletteSize;
            for (let y = height - 1; y >= 0; y--) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    view.setUint8(pos++, Math.round((imgData.data[i]*0.299 + imgData.data[i+1]*0.587 + imgData.data[i+2]*0.114)));
                }
            }
            return buffer;
        }
    </script>
</body>
</html>
