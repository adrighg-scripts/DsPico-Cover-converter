<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>8-Bit Color Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold text-yellow-500 mb-6">Strict 8-Bit Color Converter</h1>
        <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
        <button onclick="document.getElementById('fileInput').click()" class="bg-yellow-500 text-slate-900 font-bold py-3 px-8 rounded-full">Select Images</button>
        <div id="gallery" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8"></div>
        <button id="downloadAllBtn" class="hidden w-full bg-emerald-600 text-white font-bold py-4 rounded-xl mt-4">Download All as ZIP</button>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const gallery = document.getElementById('gallery');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        let processedFiles = [];

        fileInput.onchange = (e) => {
            const files = Array.from(e.target.files).slice(0, 30);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 128; canvas.height = 96;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, 128, 96);
                        
                        const imageData = ctx.getImageData(0, 0, 128, 96);
                        const buffer = create8BitBMP(imageData);
                        const blob = new Blob([buffer], {type: "image/bmp"});
                        const url = URL.createObjectURL(blob);
                        
                        const fileName = file.name.replace(/\.[^/.]+$/, "") + ".bmp";
                        processedFiles.push({ name: fileName, data: buffer });
                        
                        const div = document.createElement('div');
                        div.className = "bg-slate-800 p-2 rounded";
                        div.innerHTML = `<img src="${url}" class="w-full mb-2"><a href="${url}" download="${fileName}" class="block bg-slate-700 text-center py-1 rounded text-xs">Download</a>`;
                        gallery.appendChild(div);
                        if(processedFiles.length === files.length) downloadAllBtn.classList.remove('hidden');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        function create8BitBMP(imgData) {
            // Vereinfachte Palette: Wir nutzen hier eine Standard-Palette, 
            // da die Erstellung einer dynamischen 256-Farben-Palette den Rahmen sprengt.
            // FÃ¼r den DS ist ein 8-Bit Header mit Palette zwingend.
            const width = 128, height = 96;
            const paletteSize = 1024;
            const dataSize = width * height;
            const fileSize = 54 + paletteSize + dataSize;
            const buffer = new ArrayBuffer(fileSize);
            const view = new DataView(buffer);

            // Header
            view.setUint16(0, 0x4D42, true); view.setUint32(2, fileSize, true);
            view.setUint32(10, 54 + paletteSize, true); // Pixel Offset
            view.setUint32(14, 40, true); // DIB Size
            view.setInt32(18, width, true); view.setInt32(22, height, true);
            view.setUint16(26, 1, true); view.setUint16(28, 8, true); // 8-bit
            view.setUint32(34, dataSize, true);

            // Palette schreiben (Wir generieren eine WebSafe-Palette zur Sicherheit)
            for(let i = 0; i < 256; i++) {
                view.setUint8(54 + i*4, (i % 8) * 36);   // B
                view.setUint8(55 + i*4, (Math.floor(i/8) % 8) * 36); // G
                view.setUint8(56 + i*4, (Math.floor(i/64)) * 85); // R
            }

            // Pixel schreiben (Index in der Palette finden)
            let pos = 54 + paletteSize;
            for (let y = height - 1; y >= 0; y--) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    const r = imgData.data[i], g = imgData.data[i+1], b = imgData.data[i+2];
                    // Finde nÃ¤chsten Palettenindex
                    const index = (Math.round(r/85)*64) + (Math.floor(g/36)%8*8) + (Math.floor(b/36)%8);
                    view.setUint8(pos++, index);
                }
            }
            return buffer;
        }

        downloadAllBtn.onclick = async () => {
            const zip = new JSZip();
            processedFiles.forEach(f => zip.file(f.name, f.data));
            const content = await zip.generateAsync({type:"blob"});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = "retro_8bit_covers.zip";
            link.click();
        };
    </script>
</body>
</html>
