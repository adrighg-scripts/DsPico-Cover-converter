<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Cover Ultimate Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-yellow-500 text-center mb-8">Retro Cover Ultimate Tool</h1>

        <div id="step1" class="text-center">
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="bg-yellow-600 px-8 py-4 rounded-full font-bold">Bilder auswählen</button>
        </div>

        <div id="step2" class="hidden mt-8 text-center space-x-4">
            <button onclick="alert('Simple Download Modus aktiv')" class="bg-slate-800 px-8 py-4 rounded-xl">Simple Download</button>
            <button onclick="startProMode()" class="bg-blue-700 px-8 py-4 rounded-xl font-bold">Pro SD-Card Save</button>
        </div>

        <div id="proUI" class="hidden mt-10 grid grid-cols-2 gap-8 bg-slate-900 p-6 rounded-2xl border border-slate-800">
            <div>
                <img id="activeImg" class="w-full h-80 object-contain bg-black rounded-lg border border-slate-700">
                <div class="flex justify-between mt-4">
                    <button onclick="changeIdx(-1)" class="bg-slate-700 px-6 py-2 rounded">Zurück</button>
                    <button onclick="changeIdx(1)" class="bg-slate-700 px-6 py-2 rounded">Weiter</button>
                </div>
            </div>
            <div>
                <input type="text" id="search" placeholder="ROM suchen..." class="w-full p-3 bg-slate-800 rounded mb-4" oninput="filterRoms(this.value)">
                <div id="romList" class="h-64 overflow-y-auto space-y-1"></div>
                <button onclick="saveAll()" class="w-full mt-6 bg-emerald-600 py-4 rounded-xl font-bold">Save All Pictures</button>
            </div>
        </div>

        <p class="fixed bottom-4 right-4 text-slate-600 text-sm">v1.2</p>
    </div>

    <script>
        let images = [], roms = [], filteredRoms = [], activeIdx = 0, dirHandle, savedHistory = new Set();

        document.getElementById('fileInput').onchange = (e) => {
            Array.from(e.target.files).forEach(f => {
                const reader = new FileReader();
                reader.onload = (ev) => { images.push({ name: f.name, data: ev.target.result, rom: null, saved: false }); updateUI(); };
                reader.readAsDataURL(f);
            });
            document.getElementById('step2').classList.remove('hidden');
        };

        async function startProMode() {
            dirHandle = await window.showDirectoryPicker();
            // ROM Suche... (wie gehabt)
            document.getElementById('proUI').classList.remove('hidden');
            updateUI();
        }

        function filterRoms(val) {
            filteredRoms = roms.filter(r => r.toLowerCase().includes(val.toLowerCase()));
            renderRomList();
        }

        function changeIdx(dir) {
            activeIdx = Math.max(0, Math.min(images.length - 1, activeIdx + dir));
            updateUI();
        }

        function updateUI() {
            document.getElementById('activeImg').src = images[activeIdx].data;
        }

        function renderRomList() {
            document.getElementById('romList').innerHTML = filteredRoms.map(r => 
                `<div class="p-2 hover:bg-slate-700 cursor-pointer" onclick="assign('${r}')">${r}</div>`).join('');
        }

        function assign(romName) {
            images[activeIdx].rom = romName;
            alert("Zugewiesen: " + romName);
        }

        async function saveAll() {
            const userDir = await dirHandle.getDirectoryHandle('_pico/covers/user', {create: true});
            for(let img of images) {
                if(img.saved) continue; // Nur neue Bilder
                const name = img.rom ? img.rom.replace(/\.[^/.]+$/, ".bmp") : `nameless_${Date.now()}.bmp`;
                const fileHandle = await userDir.getFileHandle(name, {create: true});
                const writable = await fileHandle.createWritable();
                const blob = await fetch(img.data).then(r => r.blob());
                await writable.write(blob);
                await writable.close();
                img.saved = true;
            }
            alert("Nur neue Bilder wurden gespeichert!");
        }
    </script>
</body>
</html>
