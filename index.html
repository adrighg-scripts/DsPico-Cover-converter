<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DsPico Cover Converter</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-950 text-white p-6 font-sans min-h-screen flex flex-col items-center">
    
    <div class="max-w-6xl w-full flex-grow">
        <h1 class="text-3xl font-bold text-yellow-500 text-center mb-8">DsPico Cover Converter</h1>
        
        <div id="step1" class="text-center">
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="bg-yellow-600 px-12 py-6 rounded-full font-bold text-xl hover:bg-yellow-500 transition">Choose images</button>
        </div>

        <div id="step2" class="hidden mt-12 grid grid-cols-1 md:grid-cols-2 gap-8 items-stretch">
            <button onclick="enterSimpleMode()" class="bg-slate-800 p-10 rounded-2xl border-4 border-slate-600 hover:border-yellow-500 transition-all flex flex-col items-center justify-center">
                <h2 class="text-2xl font-bold">Option 1: Normal Download</h2>
            </button>
            <div id="proContainer" class="flex flex-col">
                <button id="btnOpt2" onclick="handleProClick()" class="flex-1 bg-blue-900 p-10 rounded-2xl border-4 border-blue-700 hover:border-blue-400 transition-all flex flex-col items-center justify-center">
                    <h2 class="text-2xl font-bold">Option 2: Auto SD Card Save</h2>
                    <p id="browserWarning" class="text-xs mt-2 text-blue-300 hidden">Not supported in this browser use Google Chrome,Microsoft Edge,Opera,Brave or Vivaldi!</p>
                </button>
            </div>
        </div>
        
        <div id="displayArea" class="mt-10 mb-20"></div>
    </div>

    <div class="fixed bottom-4 left-4 flex gap-4">
        <a href="https://www.reddit.com/user/XxXADRIGHGXxX/" target="_blank" class="hover:opacity-75 transition" title="Reddit"><svg class="w-8 h-8 fill-white" viewBox="0 0 20 20"><path d="M16.927 9.876c0-1.205-.98-2.185-2.185-2.185-.56 0-1.07.21-1.46.545-1.295-.91-3.05-1.48-4.995-1.545l.98-4.57 3.395.73c.01 1.055.88 1.91 1.935 1.91 1.065 0 1.935-.87 1.935-1.935 0-1.065-.87-1.935-1.935-1.935-.725 0-1.345.405-1.68 1.005l-3.665-.785c-.21-.045-.425.085-.485.295l-1.125 5.245c-2.02.05-3.835.63-5.16 1.575-.38-.34-.9-.555-1.475-.555-1.205 0-2.185.98-2.185 2.185 0 .825.465 1.535 1.155 1.905-.045.245-.075.495-.075.75 0 3.125 3.51 5.66 7.845 5.66 4.335 0 7.845-2.535 7.845-5.66 0-.255-.03-.505-.075-.75.69-.37 1.155-1.08 1.155-1.905zM6.91 11.585c0 .765-.62 1.385-1.385 1.385-.765 0-1.385-.62-1.385-1.385 0-.765.62-1.385 1.385-1.385.765 0 1.385.62 1.385 1.385zm6.79 0c0 .765-.62 1.385-1.385 1.385-.765 0-1.385-.62-1.385-1.385 0-.765.62-1.385 1.385-1.385.765 0 1.385.62 1.385 1.385zm-2.06 3.035c-1.39 1.39-3.79 1.39-5.18 0-.155-.155-.155-.415 0-.57s.415-.155.57 0c1.025 1.025 2.82 1.025 3.845 0 .155-.155.415-.155.57 0s.155.415 0 .57z"/></svg></a>
    </div>

    <p class="fixed bottom-4 right-4 text-slate-700 text-sm font-mono">v4.0</p>

    <script>
        let images = [], allRoms = [], activeIdx = 0, dirHandle = null;

        document.addEventListener("DOMContentLoaded", () => {
            if (!('showDirectoryPicker' in window)) {
                const btn = document.getElementById('btnOpt2');
                const warning = document.getElementById('browserWarning');
                btn.disabled = true;
                btn.classList.replace('bg-blue-900', 'bg-slate-800');
                btn.classList.replace('border-blue-700', 'border-slate-700');
                btn.classList.remove('hover:border-blue-400', 'cursor-pointer');
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                warning.classList.remove('hidden');
            }
        });

        function create8BitBMP(imgData) {
            const width = 128, height = 96, dataSize = width * height, paletteSize = 1024;
            const buffer = new ArrayBuffer(54 + paletteSize + dataSize);
            const view = new DataView(buffer);
            view.setUint16(0, 0x4D42, true); view.setUint32(2, buffer.byteLength, true);
            view.setUint32(10, 54 + paletteSize, true); view.setUint32(14, 40, true);
            view.setInt32(18, width, true); view.setInt32(22, height, true);
            view.setUint16(28, 8, true); view.setUint32(34, dataSize, true);
            for(let i=0; i<256; i++) {
                view.setUint8(54+i*4, ((i >> 0) & 0x03) * 85); view.setUint8(55+i*4, ((i >> 2) & 0x07) * 36);
                view.setUint8(56+i*4, ((i >> 5) & 0x07) * 36);
            }
            let pos = 54 + paletteSize;
            for (let y = height - 1; y >= 0; y--) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    view.setUint8(pos++, ((imgData.data[i] >> 5) << 5) | ((imgData.data[i+1] >> 5) << 2) | (imgData.data[i+2] >> 6));
                }
            }
            return buffer;
        }

        async function processImage(imgUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 96;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = "#000"; ctx.fillRect(0,0,128,96);
                    ctx.drawImage(img, 0, 0, 106, 96);
                    resolve(create8BitBMP(ctx.getImageData(0,0,128,96)));
                };
                img.src = imgUrl;
            });
        }

        async function getGameCode(fileHandle) {
            const file = await fileHandle.getFile();
            const buffer = await file.arrayBuffer();
            const view = new DataView(buffer);
            const name = file.name.toLowerCase();
            let code = "";
            if (name.endsWith('.nds')) { for (let i = 12; i < 16; i++) code += String.fromCharCode(view.getUint8(i)); }
            else if (name.endsWith('.gba')) { for (let i = 172; i < 176; i++) code += String.fromCharCode(view.getUint8(i)); }
            return code.replace(/[^a-z0-9]/gi, '').toUpperCase();
        }

        document.getElementById('fileInput').onchange = (e) => {
            images = Array.from(e.target.files).map(f => ({ name: f.name, data: URL.createObjectURL(f), rom: null }));
            document.getElementById('step2').classList.remove('hidden');
        };

        function enterSimpleMode() {
            const area = document.getElementById('displayArea');
            area.innerHTML = `<div id="simpleGallery" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div><button id="zipBtn" class="w-full bg-emerald-600 py-4 mt-6 rounded-xl font-bold">Download All (Zip)</button>`;
            images.forEach(img => {
                const bname = img.name.replace(/\.[^/.]+$/, ".bmp");
                const div = document.createElement('div');
                div.className = "bg-slate-900 p-2 border border-slate-700";
                div.innerHTML = `<img src="${img.data}" class="w-full h-32 object-contain mb-2"><button class="w-full bg-slate-700 py-1 text-xs">Download ${bname}</button>`;
                div.querySelector('button').onclick = async () => {
                    const b = await processImage(img.data);
                    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([b])); a.download = bname; a.click();
                };
                document.getElementById('simpleGallery').appendChild(div);
            });
            document.getElementById('zipBtn').onclick = async () => {
                const zip = new JSZip();
                for(let img of images) zip.file(img.name.replace(/\.[^/.]+$/, ".bmp"), await processImage(img.data));
                const blob = await zip.generateAsync({type:"blob"});
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "covers.zip"; a.click();
            };
        }

        async function handleProClick() {
            if (!dirHandle) dirHandle = await window.showDirectoryPicker();
            allRoms = [];
            async function scan(h) {
                for await (const e of h.values()) {
                    if (e.kind === 'file' && /\.(nes|sfc|smc|z64|n64|v64|gb|gbc|gba|gen|md|nds|3ds|snes)$/i.test(e.name)) allRoms.push(e);
                    else if (e.kind === 'directory') await scan(e);
                }
            }
            await scan(dirHandle);
            renderProUI();
        }

        function renderProUI(filter = "") {
            const img = images[activeIdx];
            const area = document.getElementById('displayArea');
            const isLast = activeIdx === images.length - 1;
            area.innerHTML = `
                <div class="grid grid-cols-2 gap-8 bg-slate-900 p-6 rounded-2xl border border-slate-800">
                    <div>
                        <img src="${img.data}" class="w-full h-80 object-contain bg-black rounded-lg">
                        <p class="mt-4 font-bold text-yellow-400">Status: ${img.rom ? img.rom.name : 'No ROM selected'}</p>
                        <div class="flex gap-4 mt-4">
                            <button onclick="nav(-1)" class="bg-slate-700 px-6 py-2 rounded">Back</button>
                            <button id="nextBtn" class="bg-emerald-600 flex-1 py-2 rounded font-bold">${isLast ? 'Save & Finish' : 'Next'}</button>
                        </div>
                    </div>
                    <div>
                        <input type="text" id="romSearch" value="${filter}" placeholder="Search ROM..." class="w-full p-3 bg-slate-800 rounded mb-4" oninput="renderProUI(this.value)">
                        <div id="romList" class="h-64 overflow-y-auto mb-4 border-b border-slate-700"></div>
                        <button onclick="assignNoRom()" class="w-full p-3 bg-slate-700 hover:bg-slate-600 rounded text-sm text-yellow-500">I don't have a ROM for this cover</button>
                    </div>
                </div>`;
            const input = document.getElementById('romSearch');
            input.focus();
            input.selectionStart = input.selectionEnd = input.value.length;
            document.getElementById('nextBtn').onclick = () => { if(isLast && img.rom) saveAll(); else nav(1); };
            const list = document.getElementById('romList');
            allRoms.filter(r => r.name.toLowerCase().includes(filter.toLowerCase())).forEach(r => {
                const el = document.createElement('div');
                el.className = `p-3 cursor-pointer border-b border-slate-700 ${images[activeIdx].rom === r ? 'bg-yellow-900' : 'hover:bg-slate-700'}`;
                el.innerText = r.name;
                el.onclick = () => { images[activeIdx].rom = r; renderProUI(filter); };
                list.appendChild(el);
            });
        }

        function assignNoRom() { images[activeIdx].rom = {name: "unnamedrom"}; renderProUI(); }
        function nav(d) { activeIdx = Math.max(0, Math.min(images.length - 1, activeIdx + d)); renderProUI(); }

        async function saveAll() {
            const coversDir = await (await dirHandle.getDirectoryHandle('_pico', {create: true})).getDirectoryHandle('covers', {create: true});
            for(let img of images) {
                if(!img.rom) continue;
                const ext = img.rom.name.split('.').pop().toLowerCase();
                let targetFolder, fileName;
                if (ext === 'nds' || ext === 'gba') {
                    targetFolder = await coversDir.getDirectoryHandle(ext, {create: true});
                    fileName = (img.rom.name !== "unnamedrom" ? await getGameCode(img.rom) : "unnamedrom") + ".bmp";
                } else {
                    targetFolder = await coversDir.getDirectoryHandle('user', {create: true});
                    fileName = img.rom.name + ".bmp";
                }
                const h = await targetFolder.getFileHandle(fileName, {create: true});
                const s = await h.createWritable();
                await s.write(new Blob([await processImage(img.data)]));
                await s.close();
            }
            alert("All covers saved successfully!"); location.reload();
        }
    </script>
</body>
</html>
